# =============================================================
# pytest.ini — Pytest Configuration
# =============================================================
# Configures pytest behaviour for this project.
# pytest-django needs to know which settings module to use during tests.
# =============================================================

[pytest]
# Tell pytest-django which Django settings module to use for tests
DJANGO_SETTINGS_MODULE = config.settings.test

# Test discovery: look for test files matching these patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Show extra test summary info
addopts =
    --strict-markers
    -v

# Register custom markers (added as tests grow)
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    security: marks security-focused tests
    performance: marks performance benchmark tests
    integration: marks integration tests requiring real database
